[package]
name = "zjit"
version = "0.0.1"
edition = "2024"
rust-version = "1.85.0" # Minimally supported rust version
publish = false         # Don't publish to crates.io

[dependencies]
capstone = { version = "0.14.0", optional = true }
cranelift-codegen = { version = "0.116", default-features = false, features = ["std", "unwind"] }
cranelift-frontend = "0.116"
target-lexicon = "0.13"
jit = { version = "0.1.0", path = "../jit" }

[dev-dependencies]
insta = "1.43.1"

# NOTE: Development builds select a set of these via configure.ac
# For debugging, `make V=1` shows exact cargo invocation.
[features]
# Support --yjit-dump-disasm and RubyVM::YJIT.disasm using libcapstone.
disasm = ["capstone"]
runtime_checks = []
stats_allocator = []
