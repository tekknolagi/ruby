name: tryzjit

# Build ruby with ZJIT via Nix and push the closure to Cachix so it can be
# booted in the browser at https://trynix.dev/?path=<store path>&cache=...
on:
  push:
    branches: [tryzjit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tryzjit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ruby-zjit (x86_64-linux) and push to Cachix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      CACHE_NAME: tryzjit
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: tryzjit
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build .#ruby-zjit --print-build-logs

      - name: Report store path and trynix link
        run: |
          store_path="$(nix path-info ./result)"
          echo "store path: $store_path"
          {
            echo "## tryzjit"
            echo
            echo "ruby revision: \`$GITHUB_SHA\`"
            echo
            echo "store path: \`$store_path\`"
            echo
            if [ -n "$CACHIX_AUTH_TOKEN" ]; then
              pubkey="$(curl -sf "https://app.cachix.org/api/v1/cache/$CACHE_NAME" | jq -r '.publicSigningKeys[0]')"
              cache_param="$(jq -rn --arg v "https://$CACHE_NAME.cachix.org $pubkey" '$v|@uri')"
              path_param="$(jq -rn --arg v "$store_path" '$v|@uri')"
              echo "[Boot it in your browser](https://trynix.dev/?path=$path_param&cache=$cache_param)"
            else
              echo "_CACHIX_AUTH_TOKEN secret is not set: the closure was not pushed to a cache, so there is no trynix link._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
